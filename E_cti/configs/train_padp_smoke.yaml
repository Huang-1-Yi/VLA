policy:
  name: padp_unet
  shape_meta: ${data.shape_meta}
  horizon: 40
  n_obs_steps: 1
  n_action_steps: 1
  pred_type: sample
  noise_schedule_mode: positionwise
  noise_chunk_size: 1
  window_loss_weights: exponential
  window_exp_gamma: 0.25
  window_min_weight: 0.02
  crop_shape: [76, 76]
  obs_encoder_group_norm: true
  eval_fixed_crop: true
  down_dims: [256, 512, 1024]
  kernel_size: 5
  n_groups: 8
  cond_predict_scale: true
  task_name: square
  scheduler:
    num_train_timesteps: 40
    beta_start: 0.0001
    beta_end: 0.02
    beta_schedule: squaredcos_cap_v2
    clip_sample: true
    set_alpha_to_one: true
    steps_offset: 0
    prediction_type: sample
data:
  n_demo: 50
  dataset_path: data/robomimic/datasets/square_d0/square_d0_abs.hdf5
  horizon: 40
  n_obs_steps: 1
  n_action_steps: 1
  abs_action: true
  use_legacy_normalizer: false
  shape_meta:
    obs:
      agentview_image: {shape: [3, 84, 84], type: rgb}
      robot0_eye_in_hand_image: {shape: [3, 84, 84], type: rgb}
      robot0_eef_pos: {shape: [3]}
      robot0_eef_quat: {shape: [4]}
      robot0_gripper_qpos: {shape: [2]}
    action: {shape: [7]}
sim:
  task_name: square_d0
  shape_meta: ${data.shape_meta}
  max_steps: 400
train:
  num_epochs: 2
  batch_size: 64
  num_workers: 0
  lr: 1.0e-4
  weight_decay: 1.0e-6
  device: cuda:0
  log_every: 50
  eval_every: 1
  ckpt_dir: data/outputs/padp_vla_smoke
  resume: false
  seed: 42
  use_ema: true
eval:
  n_test: 50
  render: false
  ckpt_path: data/outputs/padp_vla_smoke/latest.ckpt
logging:
  project: padp_vla
  name: smoke_test

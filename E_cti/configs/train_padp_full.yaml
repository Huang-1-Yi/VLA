# ============================================================
# PADP 位置感知扩散训练配置 —— Golden Standard(对照 PADP 黄金命令)
#
# 参考命令(直接对账):
#   CUDA_VISIBLE_DEVICES=0 python train_sim.py \
#     --config-name=robomimic_padp_position_wise \
#     task_name=square_d0 n_demo=200 n_obs_steps=1 horizon=40 \
#     window_exp_gamma=0.25 \
#     policy.noise_schedule_mode=positionwise \
#     dataloader.batch_size=64 \
#     policy.pred_type=sample \
#     policy.noise_scheduler.prediction_type=sample \
#     exp_name=PADP_Golden_Standard
# ============================================================

policy:
  name: padp_unet
  shape_meta: ${data.shape_meta}
  horizon: 40                # ← PADP 黄金标准
  n_obs_steps: 1             # ← PADP 黄金标准
  n_action_steps: 1          # ← bug fix 2: PADP v3 默认单步滑窗
  pred_type: sample          # ← 黄金标准
  noise_schedule_mode: positionwise  # ← 黄金标准
  noise_chunk_size: 1
  window_loss_weights: exponential
  window_exp_gamma: 0.25     # ← bug fix 3: 用户命令显式 0.25(黄金标准)
  window_min_weight: 0.02
  crop_shape: [76, 76]       # ← bug fix 1
  obs_encoder_group_norm: true
  eval_fixed_crop: true
  down_dims: [256, 512, 1024]  # ← 黄金标准
  kernel_size: 5
  n_groups: 8
  cond_predict_scale: true
  task_name: square
  # DDIMScheduler(PADP 黄金标准:num_train_timesteps=horizon)
  scheduler:
    num_train_timesteps: 40  # ← = horizon
    beta_start: 0.0001
    beta_end: 0.02
    beta_schedule: squaredcos_cap_v2
    clip_sample: true
    set_alpha_to_one: true
    steps_offset: 0
    prediction_type: sample  # ← 黄金标准

data:
  n_demo: 200                # ← 黄金标准
  dataset_path: data/robomimic/datasets/square_d0/square_d0_abs.hdf5
  horizon: 40                # ← 黄金标准
  n_obs_steps: 1             # ← 黄金标准
  n_action_steps: 1
  abs_action: true
  use_legacy_normalizer: false
  shape_meta:
    obs:
      agentview_image:
        shape: [3, 84, 84]
        type: rgb
      robot0_eye_in_hand_image:
        shape: [3, 84, 84]
        type: rgb
      robot0_eef_pos:
        shape: [3]
      robot0_eef_quat:
        shape: [4]
      robot0_gripper_qpos:
        shape: [2]
    action:
      shape: [7]            # ← 真实 hdf5 是 7 维(robomimic abs: pos3 + axis_angle3 + gripper1)

sim:
  task_name: square_d0
  shape_meta: ${data.shape_meta}
  max_steps: 400

train:
  num_epochs: 251
  batch_size: 64            # ← 黄金标准
  num_workers: 4
  lr: 1.0e-4
  weight_decay: 1.0e-6
  device: cuda:0
  log_every: 50
  eval_every: 10
  ckpt_dir: data/outputs/padp_vla
  resume: true
  seed: 42
  use_ema: true

eval:
  n_test: 50
  render: false
  ckpt_path: data/outputs/padp_vla/latest.ckpt

logging:
  project: padp_vla
  name: padp_golden_standard_h40_obs1_a1_gamma025
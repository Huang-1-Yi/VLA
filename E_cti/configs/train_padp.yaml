# ============================================================
# 训练配置:PADP 位置感知扩散(square_d0)
# 源:基于 PADP robomimic_padp_position_wise_v3.yaml
# ============================================================

policy:
  name: padp_unet
  kwargs:
    shape_meta: ${data.shape_meta}
    horizon: 40
    n_obs_steps: 1
    n_action_steps: 1                # ← bug fix 2: PADP v3 默认 1(单步滑窗)
    num_inference_steps: 40
    down_dims: [256, 512, 1024]
    kernel_size: 5
    n_groups: 8
    cond_predict_scale: true
    window_loss_weights: exponential
    window_exp_gamma: 0.25           # ← bug fix 3: 用户命令显式 0.25
    window_min_weight: 0.02
    pred_type: sample
    # bug fix 1:obs_encoder 3 个 kwarg(原 PADP yaml)
    crop_shape: [76, 76]
    obs_encoder_group_norm: true
    eval_fixed_crop: true

data:
  n_demo: 200
  dataset_path: data/robomimic/datasets/square_d0/square_d0_abs.hdf5
  horizon: 40
  n_obs_steps: 1
  n_action_steps: 8
  abs_action: true
  use_legacy_normalizer: false
  shape_meta:
    obs:
      agentview_image:
        shape: [3, 84, 84]
        type: rgb
      robot0_eye_in_hand_image:
        shape: [3, 84, 84]
        type: rgb
      robot0_eef_pos:
        shape: [3]
      robot0_eef_quat:
        shape: [4]
      robot0_gripper_qpos:
        shape: [2]
    action:
      shape: [10]

sim:
  task_name: square_d0
  shape_meta: ${data.shape_meta}
  max_steps: 400

train:
  num_epochs: 251
  batch_size: 64
  num_workers: 4
  lr: 1.0e-4
  weight_decay: 1.0e-6
  device: cuda:0
  log_every: 50
  eval_every: 10
  ckpt_dir: data/outputs/padp_vla
  resume: true
  seed: 42

eval:
  n_test: 50
  render: false
  ckpt_path: data/outputs/padp_vla/latest.ckpt

logging:
  project: padp_vla
  name: padp_unet_demo200_h40_obs1_a8
